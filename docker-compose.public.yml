# Public deployment overlay — archive.today-style, admin moderates abuse
# Usage:
#   ./scripts/setup-public.sh        # generates .env with admin hash + session secret
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d
# Or via Makefile:
#   make run-public
#
# Bundles a Caddy reverse proxy that terminates TLS via Let's Encrypt
# ACME on ports 80/443. Set ARCHIVER_PUBLIC_DOMAIN (DNS must resolve
# to this host first) + ARCHIVER_ACME_EMAIL in .env.
#
# To run behind your own external proxy instead, override the `caddy`
# service to ports: !override [] and bind the app to 127.0.0.1:8000.
services:
  postgres:
    # DB not exposed to host — inter-container only
    ports: !override []
    environment:
      # ${VAR:?msg} makes compose refuse to start when the var is unset
      # or empty — a plain ${VAR} silently becomes "" with only a
      # warning, which here would mean a passwordless-looking config
      # that fails in confusing ways later.
      POSTGRES_PASSWORD: ${ARCHIVER_DB_PASSWORD:?missing — run scripts/setup-public.sh}
    restart: always

  app:
    # Public mode: app is not host-bound. Caddy proxies inter-container
    # at app:8000 over the compose network.
    ports: !override []
    environment:
      ARCHIVER_MODE: public
      ARCHIVER_LOG_FORMAT: json
      ARCHIVER_LOG_LEVEL: INFO
      ARCHIVER_DB_URL: postgresql://archiver:${ARCHIVER_DB_PASSWORD:?missing — run scripts/setup-public.sh}@postgres:5432/archiver
      # Required — admin moderation is mandatory in public mode
      ARCHIVER_ADMIN_PASSWORD_HASH: ${ARCHIVER_ADMIN_PASSWORD_HASH:?missing — run scripts/setup-public.sh}
      ARCHIVER_SESSION_SECRET: ${ARCHIVER_SESSION_SECRET:?missing — run scripts/setup-public.sh}
      # Required — without it the destructive DELETE API is open to
      # anyone (require_api_key is a no-op on an empty key)
      ARCHIVER_API_KEY: ${ARCHIVER_API_KEY:?missing — run scripts/setup-public.sh}
      # Trust X-Forwarded-For from reverse proxy for accurate submitter IP
      ARCHIVER_TRUSTED_PROXIES: "true"
      # Domain blocklist / allowlist (empty is allowed but recommended to configure)
      ARCHIVER_BLOCKLIST_URLS: ${ARCHIVER_BLOCKLIST_URLS:-}
      ARCHIVER_BLOCKLIST_DOMAINS: ${ARCHIVER_BLOCKLIST_DOMAINS:-}
      ARCHIVER_ALLOWLIST_DOMAINS: ${ARCHIVER_ALLOWLIST_DOMAINS:-}
      # Rate limits (override defaults via env if needed)
      ARCHIVER_RATE_LIMIT_SUBMIT_PER_HOUR: ${ARCHIVER_RATE_LIMIT_SUBMIT_PER_HOUR:-60}
      ARCHIVER_RATE_LIMIT_REPORT_PER_HOUR: ${ARCHIVER_RATE_LIMIT_REPORT_PER_HOUR:-10}
      # Optional captcha (none|hcaptcha|altcha)
      ARCHIVER_CAPTCHA_PROVIDER: ${ARCHIVER_CAPTCHA_PROVIDER:-none}
      ARCHIVER_HCAPTCHA_SITEKEY: ${ARCHIVER_HCAPTCHA_SITEKEY:-}
      ARCHIVER_HCAPTCHA_SECRET: ${ARCHIVER_HCAPTCHA_SECRET:-}
      ARCHIVER_ALTCHA_HMAC_KEY: ${ARCHIVER_ALTCHA_HMAC_KEY:-}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    environment:
      ARCHIVER_LOG_FORMAT: json
      ARCHIVER_LOG_LEVEL: INFO
      ARCHIVER_DB_URL: postgresql://archiver:${ARCHIVER_DB_PASSWORD:?missing — run scripts/setup-public.sh}@postgres:5432/archiver
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"     # ACME HTTP-01 + HTTP->HTTPS redirect
      - "443:443"   # public HTTPS
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # ACME-issued certs survive restarts
      - caddy_config:/config   # autosaved JSON config
    environment:
      # DNS for this domain MUST point here before stack starts; ACME
      # HTTP-01 needs port 80 to resolve back to this host or the cert
      # request fails and Caddy retries with exponential backoff.
      ARCHIVER_PUBLIC_DOMAIN: ${ARCHIVER_PUBLIC_DOMAIN:?missing — run scripts/setup-public.sh}
      ARCHIVER_ACME_EMAIL: ${ARCHIVER_ACME_EMAIL:?missing — run scripts/setup-public.sh}
    depends_on:
      app:
        condition: service_healthy
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0

volumes:
  caddy_data:
  caddy_config:
