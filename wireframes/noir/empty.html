<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Unstoppable Archive — self-hosted web preservation with five capture tiers">
<title>No Results — Glass Noir</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{font-family:'DM Sans',system-ui,sans-serif;}.font-mono{font-family:'DM Mono',ui-monospace,monospace;}*:focus-visible{outline:2px solid #a855f7;outline-offset:2px;border-radius:4px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>
<body class="bg-[#050208] text-neutral-400 min-h-screen relative overflow-y-auto overflow-x-hidden">

<div class="fixed inset-0 pointer-events-none" aria-hidden="true">
  <div class="absolute top-[40%] left-[40%] w-[300px] h-[300px] bg-purple-900/[0.04] rounded-full blur-[120px]"></div>
</div>

<div class="relative z-10">

<header class="sticky top-0 z-50 bg-[#050208]/90 backdrop-blur-xl border-b border-white/[0.04]">
  <div class="max-w-3xl mx-auto px-6 py-3 flex items-center gap-4">
    <a href="home.html" class="shrink-0" aria-label="Home"><div class="w-1.5 h-1.5 bg-purple-400 rounded-full" aria-hidden="true"></div></a>
    <div class="flex-1 bg-white/[0.03] border border-white/[0.05] rounded-xl px-4 py-2">
      <label for="search-input" class="sr-only">Search</label>
      <input type="text" value="xyznonexistent" id="search-input" class="w-full bg-transparent text-white outline-none font-mono text-sm">
    </div>
  </div>
</header>

<main class="max-w-lg mx-auto px-6 py-20 text-center">

  <p class="text-neutral-400 mb-2">No results for</p>
  <p class="font-mono text-neutral-400 mb-10">"xyznonexistent"</p>

  <p class="text-sm text-neutral-400 mb-5">Archive a page instead?</p>
  <form class="flex gap-2 mb-14">
    <div class="flex-1 bg-white/[0.03] border border-white/[0.05] rounded-xl px-4 py-2.5">
      <label for="url-input" class="sr-only">URL to archive</label>
      <input type="url" placeholder="https://" id="url-input" class="w-full bg-transparent text-white outline-none font-mono text-sm placeholder-neutral-500">
    </div>
    <button class="px-5 py-2.5 bg-purple-500 text-white text-sm font-medium rounded-xl hover:bg-purple-400 transition">Go</button>
  </form>

  <div class="text-left">
    <p class="text-[10px] text-neutral-400 uppercase tracking-wider mb-2">Search operators</p>
    <div class="flex flex-wrap gap-1.5">
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">intitle:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">site:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">inurl:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">source:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">tier:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">before:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">after:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">size:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">has:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">is:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">net:</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">"phrase"</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">-exclude</span>
      <span class="text-[10px] px-2 py-0.5 bg-white/[0.02] text-neutral-400 rounded-lg font-mono border border-white/[0.03]">OR</span>
    </div>
  </div>
</main>
</div>
</body>
</html>
