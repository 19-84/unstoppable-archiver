<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G — Amber Glow</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  input::placeholder { opacity: 0.2; }
  .glass { background: rgba(255,255,255,0.02); backdrop-filter: blur(16px); }
  .amber-glow { box-shadow: 0 0 80px rgba(245,158,11,0.06), 0 0 30px rgba(245,158,11,0.03); }
  .input-glow:focus-within { box-shadow: 0 0 0 1px rgba(245,158,11,0.4), 0 0 20px rgba(245,158,11,0.08); }
</style>
</head>
<body class="bg-[#080808] text-neutral-300 min-h-screen flex flex-col relative overflow-hidden">

<div class="fixed inset-0 pointer-events-none">
  <div class="absolute top-[10%] left-[30%] w-[500px] h-[500px] bg-amber-500/[0.04] rounded-full blur-[150px]"></div>
</div>

<div class="relative z-10 flex flex-col min-h-screen">

<header class="px-6 py-4 flex items-center gap-2">
  <span class="text-amber-500">◆</span>
  <span class="font-medium text-sm text-neutral-400 tracking-tight">unstoppable archive</span>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-6 -mt-12">

  <h1 class="text-5xl font-bold tracking-tight text-white mb-3 text-center">
    Archive anything.
  </h1>
  <p class="text-neutral-500 mb-12 text-center">
    Paste a URL. Search your collection. We never lose a page.
  </p>

  <div class="w-full max-w-xl mb-4">
    <form class="relative">
      <div class="bg-neutral-900/80 border border-neutral-800/80 rounded-xl input-glow transition-all">
        <div class="flex items-center px-5 py-4">
          <span class="text-amber-500/60 mr-3 text-sm">›</span>
          <input type="text" placeholder="url or search query..."
                 autofocus
                 class="flex-1 bg-transparent text-neutral-100 outline-none font-mono text-[15px] placeholder-neutral-700">
          <button type="submit"
                  class="ml-3 px-5 py-1.5 bg-amber-500 text-black font-semibold text-xs rounded-lg hover:bg-amber-400 transition">
            Go
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="w-full max-w-xl flex items-center justify-between text-xs text-neutral-700 mb-20">
    <div class="flex gap-3">
      <span>clearnet</span>
      <span class="text-purple-800">tor</span>
      <span class="text-teal-800">i2p</span>
    </div>
    <div class="flex gap-1.5 font-mono text-[10px]">
      <span class="text-neutral-800 bg-neutral-900 px-1.5 py-0.5 rounded">intitle:</span>
      <span class="text-neutral-800 bg-neutral-900 px-1.5 py-0.5 rounded">site:</span>
      <span class="text-neutral-800 bg-neutral-900 px-1.5 py-0.5 rounded">before:</span>
      <span class="text-neutral-800 bg-neutral-900 px-1.5 py-0.5 rounded">"exact"</span>
      <span class="text-neutral-800 bg-neutral-900 px-1.5 py-0.5 rounded">-not</span>
    </div>
  </div>

  <div class="w-full max-w-xl glass rounded-xl amber-glow border border-neutral-800/50">
    <div class="grid grid-cols-4 divide-x divide-neutral-800/50">
      <div class="px-5 py-5 text-center">
        <div class="text-2xl font-semibold text-neutral-200 tabular-nums">1,247</div>
        <div class="text-[10px] text-neutral-600 mt-1 uppercase tracking-wider">pages</div>
      </div>
      <div class="px-5 py-5 text-center">
        <div class="text-2xl font-semibold text-neutral-200 tabular-nums">847</div>
        <div class="text-[10px] text-neutral-600 mt-1 uppercase tracking-wider">domains</div>
      </div>
      <div class="px-5 py-5 text-center">
        <div class="text-2xl font-semibold text-neutral-200 tabular-nums">823<span class="text-sm text-neutral-600">mb</span></div>
        <div class="text-[10px] text-neutral-600 mt-1 uppercase tracking-wider">stored</div>
      </div>
      <div class="px-5 py-5 text-center">
        <div class="text-2xl font-semibold text-amber-400 tabular-nums">98.2<span class="text-sm">%</span></div>
        <div class="text-[10px] text-neutral-600 mt-1 uppercase tracking-wider">success</div>
      </div>
    </div>
  </div>

</main>

<footer class="px-6 py-3 text-center text-[10px] text-neutral-800">
  5 tiers · chromium → camoufox → proxy → wayback → archive.today
</footer>

</div>
</body>
</html>
