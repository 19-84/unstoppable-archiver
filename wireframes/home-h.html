<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H — Deep Purple Ambient</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; }
  .font-mono { font-family: 'DM Mono', ui-monospace, monospace; }
  input::placeholder { opacity: 0.2; }
</style>
</head>
<body class="bg-[#050208] text-neutral-400 min-h-screen flex flex-col relative overflow-hidden">

<div class="fixed inset-0 pointer-events-none">
  <div class="absolute top-[-10%] right-[20%] w-[700px] h-[700px] bg-purple-600/[0.05] rounded-full blur-[180px]"></div>
  <div class="absolute bottom-[-20%] left-[10%] w-[400px] h-[400px] bg-violet-800/[0.04] rounded-full blur-[140px]"></div>
</div>

<div class="relative z-10 flex flex-col min-h-screen">

<header class="px-8 py-5 flex items-center justify-between">
  <div class="flex items-center gap-2.5">
    <div class="w-1.5 h-1.5 bg-purple-400 rounded-full"></div>
    <span class="text-sm text-neutral-500">unstoppable archive</span>
  </div>
  <div class="flex items-center gap-3 text-[10px] text-neutral-700 uppercase tracking-widest">
    <span>clear</span>
    <span class="text-purple-700">onion</span>
    <span class="text-violet-800">i2p</span>
  </div>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-8 -mt-8">

  <div class="w-full max-w-lg text-center mb-14">
    <h1 class="text-[2.75rem] font-bold text-white tracking-tight leading-tight mb-4">
      Preserve the web.
    </h1>
    <p class="text-neutral-600 text-[15px]">
      Five capture tiers. Full-text search. Nothing escapes.
    </p>
  </div>

  <div class="w-full max-w-lg mb-5">
    <form>
      <div class="relative group">
        <div class="absolute -inset-[1px] bg-gradient-to-r from-purple-500/20 via-violet-500/10 to-purple-500/20 rounded-2xl opacity-0 group-focus-within:opacity-100 transition-opacity duration-500"></div>
        <div class="relative bg-[#0c0a12] border border-neutral-800/60 rounded-2xl">
          <div class="flex items-center px-5 py-4">
            <input type="text" placeholder="paste url or search..."
                   autofocus
                   class="flex-1 bg-transparent text-white outline-none text-[15px] placeholder-neutral-800 font-mono">
            <button type="submit"
                    class="ml-3 px-5 py-2 bg-purple-500/90 text-white text-xs font-medium rounded-xl hover:bg-purple-400 transition">
              Go
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="w-full max-w-lg flex flex-wrap justify-center gap-2 mb-20">
    <span class="text-[10px] px-2.5 py-1 bg-white/[0.02] text-neutral-700 rounded-lg font-mono border border-white/[0.03]">intitle:</span>
    <span class="text-[10px] px-2.5 py-1 bg-white/[0.02] text-neutral-700 rounded-lg font-mono border border-white/[0.03]">site:</span>
    <span class="text-[10px] px-2.5 py-1 bg-white/[0.02] text-neutral-700 rounded-lg font-mono border border-white/[0.03]">source:</span>
    <span class="text-[10px] px-2.5 py-1 bg-white/[0.02] text-neutral-700 rounded-lg font-mono border border-white/[0.03]">before:</span>
    <span class="text-[10px] px-2.5 py-1 bg-white/[0.02] text-neutral-700 rounded-lg font-mono border border-white/[0.03]">after:</span>
    <span class="text-[10px] px-2.5 py-1 bg-white/[0.02] text-neutral-700 rounded-lg font-mono border border-white/[0.03]">net:</span>
    <span class="text-[10px] px-2.5 py-1 bg-white/[0.02] text-neutral-700 rounded-lg font-mono border border-white/[0.03]">"phrase"</span>
    <span class="text-[10px] px-2.5 py-1 bg-white/[0.02] text-neutral-700 rounded-lg font-mono border border-white/[0.03]">-exclude</span>
  </div>

  <div class="w-full max-w-lg">
    <div class="bg-white/[0.02] rounded-2xl border border-white/[0.04] p-6">
      <div class="grid grid-cols-4 gap-4">
        <div class="text-center">
          <div class="text-xl font-semibold text-neutral-200">1,247</div>
          <div class="text-[10px] text-neutral-700 mt-1">pages</div>
        </div>
        <div class="text-center">
          <div class="text-xl font-semibold text-neutral-200">847</div>
          <div class="text-[10px] text-neutral-700 mt-1">domains</div>
        </div>
        <div class="text-center">
          <div class="text-xl font-semibold text-neutral-200">823<span class="text-xs text-neutral-700">mb</span></div>
          <div class="text-[10px] text-neutral-700 mt-1">stored</div>
        </div>
        <div class="text-center">
          <div class="text-xl font-semibold text-purple-400">98.2%</div>
          <div class="text-[10px] text-neutral-700 mt-1">success</div>
        </div>
      </div>
    </div>
  </div>

</main>

<footer class="px-8 py-4 text-center text-[10px] text-neutral-800">
  chromium → camoufox → proxy → wayback → archive.today
</footer>

</div>
</body>
</html>
