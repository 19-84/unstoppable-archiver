services:
  web:
    image: python:3.12-slim
    working_dir: /srv
    command: python -m http.server 8080
    ports:
      - "8888:8080"
    volumes:
      - ./:/srv:ro

  tor:
    image: leplusorg/tor:latest
    environment:
      SKIP_TEMPLATE: "true"
    volumes:
      - ./torrc.template:/etc/tor/torrc:ro
    depends_on:
      - web
