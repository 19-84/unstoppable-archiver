<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capturing — Warm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',system-ui,sans-serif;}
.font-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.pulse{animation:pulse 2s ease-in-out infinite;}
.slide-bar{position:relative;overflow:hidden;}
.slide-bar::after{content:'';position:absolute;top:0;left:0;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(245,158,11,0.3),transparent);animation:slide 1.5s infinite;}
</style>
</head>
<body class="bg-neutral-950 text-neutral-300 min-h-screen">

<header class="sticky top-0 z-50 bg-neutral-950/95 backdrop-blur border-b border-neutral-800/50">
  <div class="max-w-4xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4 min-w-0">
      <a href="home.html" class="text-amber-500 hover:text-amber-400 text-sm shrink-0">←</a>
      <div class="h-4 w-px bg-neutral-800"></div>
      <span class="font-mono text-xs text-neutral-500 truncate">protected-site.com/article</span>
      <div class="h-4 w-px bg-neutral-800"></div>
      <span class="text-xs text-amber-400 flex items-center gap-1.5 shrink-0">
        <span class="w-1.5 h-1.5 bg-amber-400 rounded-full pulse"></span>Capturing
      </span>
    </div>
  </div>
</header>

<main class="max-w-2xl mx-auto px-6 py-12">

  <h1 class="text-xl font-bold text-white mb-1">Capturing...</h1>
  <p class="font-mono text-sm text-neutral-600 mb-8">https://protected-site.com/article</p>

  <div class="h-1 bg-neutral-900 rounded-full mb-10 slide-bar">
    <div class="h-full bg-amber-500 rounded-full" style="width:40%"></div>
  </div>

  <div class="space-y-1">
    <div class="flex items-center gap-3 px-4 py-3 rounded-lg">
      <span class="w-6 text-center text-red-400 text-xs">✗</span>
      <span class="text-sm text-neutral-500 w-40">Tier 1 · Chromium</span>
      <span class="text-xs text-red-400/60 font-mono">403 Forbidden</span>
      <span class="text-[10px] text-neutral-700 ml-auto">0.8s</span>
    </div>

    <div class="flex items-center gap-3 px-4 py-3 rounded-lg bg-amber-500/[0.04] border border-amber-500/10">
      <span class="w-6 text-center text-amber-400 text-sm pulse">◐</span>
      <span class="text-sm text-white font-medium w-40">Tier 2 · Camoufox</span>
      <span class="text-xs text-amber-400/70">Stealth rendering...</span>
      <span class="text-[10px] text-amber-400/50 ml-auto pulse">12s</span>
    </div>

    <div class="flex items-center gap-3 px-4 py-3 rounded-lg opacity-30">
      <span class="w-6 text-center text-neutral-700 text-xs">○</span>
      <span class="text-sm text-neutral-700 w-40">Tier 3 · Proxy</span>
    </div>

    <div class="flex items-center gap-3 px-4 py-3 rounded-lg opacity-20">
      <span class="w-6 text-center text-neutral-700 text-xs">○</span>
      <span class="text-sm text-neutral-700 w-40">Tier 4 · Wayback</span>
    </div>

    <div class="flex items-center gap-3 px-4 py-3 rounded-lg opacity-15">
      <span class="w-6 text-center text-neutral-700 text-xs">○</span>
      <span class="text-sm text-neutral-700 w-40">Tier 5 · archive.today</span>
    </div>
  </div>

</main>
</body>
</html>
