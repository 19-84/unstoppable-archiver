<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variation F — Void</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Geist Mono', ui-monospace, monospace; letter-spacing: -0.01em; }
  input::placeholder { opacity: 0.2; }
  .dotted { background-image: radial-gradient(circle, #222 1px, transparent 1px); background-size: 20px 20px; }
</style>
</head>
<body class="bg-black text-neutral-500 min-h-screen flex flex-col dotted">

<header class="px-6 py-4">
  <span class="text-[10px] uppercase tracking-[0.2em] text-neutral-700">unstoppable archive</span>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-6 -mt-6">

  <div class="w-full max-w-md text-center mb-12">
    <div class="text-6xl mb-6 text-neutral-800">◆</div>
    <p class="text-sm text-neutral-600 leading-relaxed">
      url → archive<br>
      text → search
    </p>
  </div>

  <div class="w-full max-w-md mb-3">
    <form>
      <input type="text" placeholder="url or query"
             autofocus
             class="w-full px-0 py-3 text-center text-lg bg-transparent border-b border-neutral-900 text-white outline-none focus:border-neutral-600 transition placeholder-neutral-800">
      <div class="flex justify-center mt-4">
        <button type="submit"
                class="px-12 py-2.5 border border-neutral-800 text-neutral-400 text-xs uppercase tracking-[0.15em] hover:border-neutral-500 hover:text-white transition">
          submit
        </button>
      </div>
    </form>
  </div>

  <div class="w-full max-w-md flex flex-wrap justify-center gap-1 text-[10px] text-neutral-800 mt-6 mb-20">
    <span>intitle:</span>
    <span>·</span>
    <span>site:</span>
    <span>·</span>
    <span>inurl:</span>
    <span>·</span>
    <span>source:</span>
    <span>·</span>
    <span>before:</span>
    <span>·</span>
    <span>after:</span>
    <span>·</span>
    <span>net:</span>
    <span>·</span>
    <span>"phrase"</span>
    <span>·</span>
    <span>-exclude</span>
  </div>

  <!-- Stats as a single quiet line -->
  <div class="w-full max-w-md">
    <div class="flex items-center justify-between text-xs border-t border-neutral-900 pt-4">
      <div class="text-center">
        <span class="text-neutral-400">1,247</span>
        <span class="text-neutral-800 ml-1">pages</span>
      </div>
      <div class="text-neutral-900">·</div>
      <div class="text-center">
        <span class="text-neutral-400">847</span>
        <span class="text-neutral-800 ml-1">domains</span>
      </div>
      <div class="text-neutral-900">·</div>
      <div class="text-center">
        <span class="text-neutral-400">823</span>
        <span class="text-neutral-800 ml-1">MB</span>
      </div>
      <div class="text-neutral-900">·</div>
      <div class="text-center">
        <span class="text-neutral-400">98.2%</span>
        <span class="text-neutral-800 ml-1">success</span>
      </div>
    </div>
  </div>

</main>

<footer class="px-6 py-4 text-center">
  <div class="text-[10px] text-neutral-900">
    https · .onion · .i2p
  </div>
</footer>

</body>
</html>
