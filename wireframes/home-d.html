<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variation D — Glass Noir</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; }
  .font-mono { font-family: 'DM Mono', ui-monospace, monospace; }
  input::placeholder { opacity: 0.25; }
  .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .glow { box-shadow: 0 0 60px rgba(168,85,247,0.08); }
  .gradient-border { background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(236,72,153,0.2), rgba(168,85,247,0.1)); padding: 1px; }
  .gradient-border > * { background: #0a0a0a; }
</style>
</head>
<body class="bg-[#0a0a0a] text-neutral-300 min-h-screen flex flex-col overflow-hidden relative">

<!-- Subtle background gradient -->
<div class="fixed inset-0 pointer-events-none">
  <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-purple-900/10 rounded-full blur-[120px]"></div>
  <div class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-pink-900/8 rounded-full blur-[120px]"></div>
</div>

<div class="relative z-10 flex flex-col min-h-screen">

<header class="px-8 py-5 flex items-center justify-between">
  <div class="flex items-center gap-2">
    <div class="w-2 h-2 bg-purple-500 rounded-full"></div>
    <span class="text-sm text-neutral-500 font-medium">unstoppable archive</span>
  </div>
  <div class="flex items-center gap-4 text-xs text-neutral-700">
    <span>clearnet</span>
    <span class="text-purple-700">tor</span>
    <span class="text-pink-800">i2p</span>
  </div>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-8 -mt-8">

  <div class="w-full max-w-lg text-center mb-10">
    <h1 class="text-4xl font-bold text-white tracking-tight mb-3 leading-tight">
      Preserve the web<br>
      <span class="bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">before it disappears</span>
    </h1>
    <p class="text-neutral-500 text-sm">
      Five capture tiers. Full-text search. Tor + I2P.
    </p>
  </div>

  <div class="w-full max-w-lg mb-4">
    <div class="gradient-border rounded-xl">
      <form class="rounded-xl overflow-hidden">
        <div class="flex items-center px-4 py-3.5">
          <div class="w-2 h-2 bg-purple-500 rounded-full mr-3 shrink-0"></div>
          <input type="text" placeholder="paste a URL or search..."
                 autofocus
                 class="flex-1 bg-transparent text-neutral-200 outline-none placeholder-neutral-700 font-mono text-sm">
          <button type="submit"
                  class="ml-3 px-5 py-1.5 bg-purple-600 text-white text-xs font-medium rounded-lg hover:bg-purple-500 transition shrink-0">
            Go
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="w-full max-w-lg flex flex-wrap justify-center gap-1.5 text-xs mb-16">
    <span class="px-2 py-0.5 text-neutral-700 font-mono glass rounded">intitle:</span>
    <span class="px-2 py-0.5 text-neutral-700 font-mono glass rounded">site:</span>
    <span class="px-2 py-0.5 text-neutral-700 font-mono glass rounded">source:</span>
    <span class="px-2 py-0.5 text-neutral-700 font-mono glass rounded">before:</span>
    <span class="px-2 py-0.5 text-neutral-700 font-mono glass rounded">after:</span>
    <span class="px-2 py-0.5 text-neutral-700 font-mono glass rounded">net:</span>
    <span class="px-2 py-0.5 text-neutral-700 font-mono glass rounded">"exact"</span>
    <span class="px-2 py-0.5 text-neutral-700 font-mono glass rounded">-exclude</span>
  </div>

  <div class="w-full max-w-lg glass rounded-xl glow p-6">
    <div class="grid grid-cols-4 gap-6 text-center">
      <div>
        <div class="text-xl font-semibold text-white">1,247</div>
        <div class="text-[11px] text-neutral-600 mt-0.5">pages</div>
      </div>
      <div>
        <div class="text-xl font-semibold text-white">847</div>
        <div class="text-[11px] text-neutral-600 mt-0.5">domains</div>
      </div>
      <div>
        <div class="text-xl font-semibold text-white">823 <span class="text-xs text-neutral-600">MB</span></div>
        <div class="text-[11px] text-neutral-600 mt-0.5">stored</div>
      </div>
      <div>
        <div class="text-xl font-semibold text-purple-400">98.2%</div>
        <div class="text-[11px] text-neutral-600 mt-0.5">success</div>
      </div>
    </div>
  </div>

</main>

<footer class="px-8 py-4 text-center text-[11px] text-neutral-800">
  chromium → camoufox → proxy → wayback → archive.today
</footer>

</div>
</body>
</html>
