<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive Detail — Capturing</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<style>
@keyframes pulse-bar { 0%,100%{opacity:.4} 50%{opacity:1} }
.pulse-bar { animation: pulse-bar 2s ease-in-out infinite; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

<nav class="border-b border-slate-800 px-6 py-3">
  <a href="/" class="text-lg font-bold text-sky-400">◆ unstoppable archive</a>
</nav>

<main class="max-w-4xl mx-auto px-4 py-8">

  <a href="/home.html" class="text-sky-400 hover:text-sky-300 text-sm mb-6 block">← Back</a>

  <section class="bg-slate-900 border border-slate-800 rounded-xl p-8">
    <h1 class="text-2xl font-bold mb-4">Capturing...</h1>

    <dl class="grid grid-cols-[auto_1fr] gap-x-6 gap-y-2 text-sm mb-6">
      <dt class="text-slate-500">URL</dt>
      <dd class="font-mono text-slate-300 truncate">https://protected-site.com/article</dd>

      <dt class="text-slate-500">Status</dt>
      <dd>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-sky-500/20 text-sky-400">
          ◐ Capturing (Tier 2: Camoufox)
        </span>
      </dd>
    </dl>

    <!-- Progress bar -->
    <div class="w-full h-2 bg-slate-800 rounded-full mb-8 overflow-hidden">
      <div class="h-full bg-sky-500 rounded-full pulse-bar" style="width: 40%"></div>
    </div>

    <!-- Tier escalation -->
    <div class="space-y-3">
      <div class="flex items-center gap-3">
        <span class="w-5 text-center text-red-400">✗</span>
        <span class="text-slate-400 w-40">Tier 1 · Chromium</span>
        <span class="text-red-400 text-sm">403 Forbidden</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-5 text-center text-sky-400 animate-pulse">◐</span>
        <span class="text-slate-100 w-40 font-medium">Tier 2 · Camoufox</span>
        <span class="text-sky-400 text-sm">In progress...</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-5 text-center text-slate-600">○</span>
        <span class="text-slate-600 w-40">Tier 3 · Proxy</span>
        <span class="text-slate-600 text-sm">Pending</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-5 text-center text-slate-600">○</span>
        <span class="text-slate-600 w-40">Tier 4 · Wayback</span>
        <span class="text-slate-600 text-sm">Pending</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-5 text-center text-slate-600">○</span>
        <span class="text-slate-600 w-40">Tier 5 · archive.today</span>
        <span class="text-slate-600 text-sm">Pending</span>
      </div>
    </div>
  </section>

</main>
</body>
</html>
