services:
  app:
    build:
      context: .
      target: dev
    command: uv run uvicorn archiver.app:create_app --factory --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      # Tool config (ruff/pyright/pytest) lives here — mounted so gate
      # runs pick up config edits without an image rebuild. Dependency
      # changes still need `make build` (the venv is baked).
      - ./pyproject.toml:/app/pyproject.toml
      - artifacts:/data

  worker:
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - artifacts:/data

volumes:
  artifacts:
