[project]
name = "unstoppable-archive"
version = "0.1.0"
description = "Self-hosted web archiver with multi-tier anti-bot capture"
requires-python = ">=3.12"
license = { text = "Unlicense" }
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.44",
    "jinja2>=3.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "structlog>=25.5",
    "beartype>=0.22",
    "icontract>=2.7",
    "playwright>=1.58",
    "playwright-stealth>=2.0",
    "camoufox[geoip]>=0.4",
    "pillow>=12.2",
    "asyncpg>=0.31",
    "warcio>=1.8",
    # `[socks]` extras pull in `socksio` so httpx can route through
    # socks4/socks5 proxies (85%+ of public proxy lists are SOCKS5).
    # socksio listed explicitly — the extras-via-spec indirection has
    # shipped without socksio in the synced venv more than once.
    "httpx[socks]>=0.28",
    "socksio>=1.0",
    "python-multipart>=0.0.27",
    "python-ulid>=3.1",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "prometheus-client>=0.23",
    # zstd compression of snapshot.html — plain HTML compresses ~5x.
    # Archives stay forever so disk grows monotonically; compressing
    # the largest per-archive file makes that growth ~5x cheaper.
    # Pure-Rust wheel, no system deps; level 19 (slow compress, fast
    # decompress, max ratio) is the chosen knob.
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pyright>=1.1",
    "pre-commit>=4.5",
    "bandit>=1.9",
    "asyncpg-stubs>=0.31",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "pytest-randomly>=4.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "pytest-asyncio>=1.3",
    "hypothesis>=6.152",
    "polyfactory>=3.3",
    "respx>=0.23",
    "time-machine>=3.2",
    "mutmut>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archiver"]
# Ship the SQL migration files inside the wheel — the runner loads
# them at startup via Path(__file__).parent / "migrations" so they
# must travel with the installed package, not just live in the repo.
[tool.hatch.build.targets.wheel.force-include]
"src/archiver/migrations" = "archiver/migrations"
"src/archiver/vendor" = "archiver/vendor"

# -- Ruff (Official "good balance" + extras) --
[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "I",      # isort
    "N",      # pep8-naming
    "C4",     # flake8-comprehensions
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "C90",    # mccabe complexity
    "PLR",    # pylint refactor
]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-returns = 5
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]
# S608: All queries use parameterized $N placeholders; string concat is for
# module-level column-list constants (_ARCHIVE_COLS, _JOB_COLS), not user input.
"src/archiver/repository.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# -- Pyright (Strict mode with strict inference) --
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "build"]
# Point pyright at the uv-managed venv so it can resolve asyncpg,
# structlog, beartype, ulid, asyncpg-stubs, etc. Without these keys
# pyright didn't find site-packages and reported every third-party
# import as missing — which cascaded into thousands of Unknown-type
# errors downstream. The deps were already installed; pyright just
# didn't know where to look.
venvPath = "."
venv = ".venv"
# Per-path overrides: tests routinely poke _private attrs of the unit
# under test (mocking _job_repo, asserting on _process_job_inner, etc)
# and drive it through Mock/patch chains whose members are Unknown by
# nature — annotating every mock interaction buys noise, not safety.
# That's the established test pattern in this codebase, not a code
# smell to fix in src/. Disabling these rules globally would hide real
# issues in src/; the executionEnvironments override scopes the
# relaxation to the test tree only. src/ stays fully strict.
executionEnvironments = [
    # extraPaths lets pyright resolve `tests.integration.conftest`
    # imports the same way pytest's rootdir insertion does.
    { root = "tests", extraPaths = ["."], reportPrivateUsage = "none", reportUnknownMemberType = "none", reportUnknownVariableType = "none", reportUnknownArgumentType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportMissingParameterType = "none", reportAttributeAccessIssue = "none", reportUntypedFunctionDecorator = "none", reportUnnecessaryTypeIgnoreComment = "none" },
]
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingParameterType = "warning"
reportDeprecated = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportMissingTypeStubs = "warning"

# -- Pytest --
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=src",
    "--cov-branch",
    "--cov-fail-under=95",
]
asyncio_mode = "auto"
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "integration: integration tests",
    "hypothesis: property-based tests",
    "contracts: contract verification tests",
]
filterwarnings = ["error"]
timeout = 300

# -- Coverage --
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# -- Mutmut --
[tool.mutmut]
paths_to_mutate = "src/archiver/"
tests_dir = "tests/"

# -- Bandit --
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
