# WARNING: This compose file uses dev-only credentials.
# For production, use Docker secrets or an .env file with strong passwords.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archiver
      POSTGRES_PASSWORD: archiver  # DEV ONLY — override in production
      POSTGRES_DB: archiver
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiver"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Resource caps via compose-native keys. `deploy.resources` only
    # applies under Docker Swarm; mem_limit/cpus apply to plain
    # `docker compose up` which is what dev + self-hosted prod use.
    mem_limit: 1g
    memswap_limit: 1g       # disable swap — OOM-kill is preferable to thrashing
    cpus: 2.0

  app:
    build:
      context: .
      target: dev
    command: uv run uvicorn archiver.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/data
    environment:
      ARCHIVER_DB_URL: postgresql://archiver:archiver@postgres:5432/archiver
      ARCHIVER_ARTIFACTS_DIR: /data/archives
      ARCHIVER_LOG_FORMAT: console
      ARCHIVER_LOG_LEVEL: INFO
      # Guards the public /metrics endpoint. Empty (the default) leaves
      # /metrics open. To lock it down, set ARCHIVER_METRICS_TOKEN in a
      # gitignored .env file and add a matching credential to
      # deploy/prometheus/prometheus.yml — never commit the token.
      ARCHIVER_METRICS_TOKEN: ${ARCHIVER_METRICS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5

  worker:
    build:
      context: .
      target: dev
    # Run an init process (tini) as PID 1. The worker launches
    # Camoufox/Firefox, whose child processes (Socket/RDD/Utility)
    # get orphaned and reparented to PID 1 when a browser closes.
    # uv/python as PID 1 only reaps its own direct children, so those
    # orphans pile up as zombies — observed 771 defunct processes
    # after hours of capture cycles, correlating with steadily
    # rising capture latency as the PID table filled. tini reaps any
    # reparented zombie automatically.
    init: true
    command: uv run python -m archiver
    volumes:
      - artifacts:/data
      - camoufox_cache:/root/.cache
    environment:
      ARCHIVER_DB_URL: postgresql://archiver:archiver@postgres:5432/archiver
      ARCHIVER_ARTIFACTS_DIR: /data/archives
      ARCHIVER_LOG_FORMAT: console
      ARCHIVER_LOG_LEVEL: INFO
      ARCHIVER_WORKER_ID: worker-1
      ARCHIVER_WORKER_METRICS_PORT: "9090"
      # SOCKS5-only curated lists. HTTP/HTTPS proxies are excluded because
      # the archive.today CF gate rejects them (100% of HTTP proxies failed
      # during gate fingerprinting). Refresh intervals vary: proxifly 5min,
      # zloi-user 10min, TheSpeedX daily. Dedup happens in load_proxies().
      ARCHIVER_PROXY_LIST_URLS: "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt,https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt,https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks5/data.txt,https://raw.githubusercontent.com/zloi-user/hideip.me/master/socks5.txt,https://raw.githubusercontent.com/mmpx12/proxy-list/master/socks5.txt,https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt"
      # 0 = no cap. Startup health check filters dead entries regardless.
      ARCHIVER_PROXY_MAX_COUNT: "0"
      ARCHIVER_PROXY_HEALTH_CHECK_ENABLED: "true"
      ARCHIVER_PROXY_HEALTH_CHECK_CONCURRENCY: "50"
      DISPLAY: ":99"
    entrypoint: >
      sh -c "Xvfb :99 -screen 0 1920x1080x24 &
             exec uv run python -m archiver"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Worker runs Camoufox (Firefox-based stealth browser ~1-1.5 GB
    # per session) at max_concurrent_captures=2, so peak is ~3 GB
    # for browsers alone, plus ~300 MB for the python process and
    # ~500 MB headroom for SingleFile serialization buffers. 5 GB
    # caps at ~1.4× peak. memswap_limit==mem_limit disables swap so
    # a runaway capture OOM-kills cleanly instead of dragging the
    # host into thrashing for hours (the 2 h hang we recovered from
    # earlier was a process hang, not an OOM, but unlimited swap
    # would have masked it longer).
    mem_limit: 5g
    memswap_limit: 5g
    cpus: 4.0

  # Scheduled backups. Opt-in via the `backup` compose profile so it
  # only runs in real deployments — dev shells that just want the app
  # don't need it. Fires once per BACKUP_INTERVAL_SECONDS (default
  # 86400 = daily). pg_dump runs inside the container as the
  # postgres user, so credentials never leave the docker network.
  # Verify drills (verify_backup.sh) should be scheduled separately
  # — typically host cron once a week — because they need a postgres
  # superuser URL to create/drop scratch databases.
  backup:
    # Use the postgres image directly — it ships pg_dump/psql, plus
    # the alpine base has sh + tar + gzip + find + sha256sum out of
    # the box. Keeps the app image lean (no postgres-client there)
    # and the backup container ~50 MB instead of the multi-GB app.
    image: postgres:17-alpine
    command: >
      sh -c "while true; do
               /app/scripts/backup.sh || echo 'backup failed';
               sleep $${BACKUP_INTERVAL_SECONDS:-86400};
             done"
    volumes:
      - artifacts:/data
      - backups:/data/backups
      # Mount scripts/ read-only so we don't need to rebuild the image
      # every time backup.sh changes. The container's only role is to
      # execute these scripts on a schedule.
      - ./scripts:/app/scripts:ro
    environment:
      ARCHIVER_DB_URL: postgresql://archiver:archiver@postgres:5432/archiver
      ARCHIVER_ARTIFACTS_DIR: /data/archives
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_INTERVAL_SECONDS: "86400"   # daily
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - backup
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0

  # Observability stack. Opt-in via the `monitoring` profile so dev
  # shells don't carry it. Prometheus scrapes worker:9090, applies
  # the alert rules in deploy/prometheus/archiver.rules.yml; Grafana
  # auto-provisions the Prometheus datasource and a single
  # pre-built dashboard. Replace the bundled stack with your own
  # Prometheus / Grafana / VM by skipping the profile and pointing
  # your existing scrape at this host.
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30d retention is enough for incident review; alert-history
      # lives in Alertmanager when the operator adds it. Bump if you
      # need longer baselines.
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"   # 9091 host-side to avoid clashing
                                 # with worker:9090
    restart: unless-stopped
    profiles:
      - monitoring
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0

  grafana:
    image: grafana/grafana:latest
    environment:
      # Override the admin password if you're going to expose Grafana.
      # Default is "admin" / "admin"; Grafana itself forces a change
      # on first login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous reads disabled by default — admin auth required.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0

  tor:
    image: leplusorg/tor:latest
    restart: unless-stopped
    profiles:
      - darknet

  i2p:
    image: purplei2p/i2pd:latest
    restart: unless-stopped
    profiles:
      - darknet

volumes:
  pgdata:
  artifacts:
  backups:
  camoufox_cache:
  prom_data:
  grafana_data:
