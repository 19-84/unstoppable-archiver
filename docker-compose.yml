# WARNING: This compose file uses dev-only credentials.
# For production, use Docker secrets or an .env file with strong passwords.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archiver
      POSTGRES_PASSWORD: archiver  # DEV ONLY — override in production
      POSTGRES_DB: archiver
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archiver"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Resource caps via compose-native keys. `deploy.resources` only
    # applies under Docker Swarm; mem_limit/cpus apply to plain
    # `docker compose up` which is what dev + self-hosted prod use.
    mem_limit: 1g
    memswap_limit: 1g       # disable swap — OOM-kill is preferable to thrashing
    cpus: 2.0

  app:
    build:
      context: .
      target: dev
    command: uv run uvicorn archiver.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/data
    environment:
      ARCHIVER_DB_URL: postgresql://archiver:archiver@postgres:5432/archiver
      ARCHIVER_ARTIFACTS_DIR: /data/archives
      ARCHIVER_LOG_FORMAT: console
      ARCHIVER_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5

  worker:
    build:
      context: .
      target: dev
    command: uv run python -m archiver
    volumes:
      - artifacts:/data
      - camoufox_cache:/root/.cache
    environment:
      ARCHIVER_DB_URL: postgresql://archiver:archiver@postgres:5432/archiver
      ARCHIVER_ARTIFACTS_DIR: /data/archives
      ARCHIVER_LOG_FORMAT: console
      ARCHIVER_LOG_LEVEL: INFO
      ARCHIVER_WORKER_ID: worker-1
      ARCHIVER_WORKER_METRICS_PORT: "9090"
      # SOCKS5-only curated lists. HTTP/HTTPS proxies are excluded because
      # the archive.today CF gate rejects them (100% of HTTP proxies failed
      # during gate fingerprinting). Refresh intervals vary: proxifly 5min,
      # zloi-user 10min, TheSpeedX daily. Dedup happens in load_proxies().
      ARCHIVER_PROXY_LIST_URLS: "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt,https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt,https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks5/data.txt,https://raw.githubusercontent.com/zloi-user/hideip.me/master/socks5.txt,https://raw.githubusercontent.com/mmpx12/proxy-list/master/socks5.txt,https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt"
      # 0 = no cap. Startup health check filters dead entries regardless.
      ARCHIVER_PROXY_MAX_COUNT: "0"
      ARCHIVER_PROXY_HEALTH_CHECK_ENABLED: "true"
      ARCHIVER_PROXY_HEALTH_CHECK_CONCURRENCY: "50"
      DISPLAY: ":99"
    entrypoint: >
      sh -c "Xvfb :99 -screen 0 1920x1080x24 &
             exec uv run python -m archiver"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Worker runs Camoufox (Firefox-based stealth browser ~1-1.5 GB
    # per session) at max_concurrent_captures=2, so peak is ~3 GB
    # for browsers alone, plus ~300 MB for the python process and
    # ~500 MB headroom for SingleFile serialization buffers. 5 GB
    # caps at ~1.4× peak. memswap_limit==mem_limit disables swap so
    # a runaway capture OOM-kills cleanly instead of dragging the
    # host into thrashing for hours (the 2 h hang we recovered from
    # earlier was a process hang, not an OOM, but unlimited swap
    # would have masked it longer).
    mem_limit: 5g
    memswap_limit: 5g
    cpus: 4.0

  tor:
    image: leplusorg/tor:latest
    restart: unless-stopped
    profiles:
      - darknet

  i2p:
    image: purplei2p/i2pd:latest
    restart: unless-stopped
    profiles:
      - darknet

volumes:
  pgdata:
  artifacts:
  camoufox_cache:
