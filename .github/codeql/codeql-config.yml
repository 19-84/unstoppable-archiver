name: "CodeQL Python Configuration"

# Paths to ignore: tests, vendored third-party code (the SingleFile
# bundle alone is megabytes of upstream JS), design wireframes, and
# deploy/doc trees with no Python in them.
paths-ignore:
  - tests
  - wireframes
  - docs
  - deploy
  - tor
  - src/archiver/vendor
  - "**/__pycache__"
