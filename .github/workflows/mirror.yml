name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-forgejo:
    name: Mirror to Forgejo
    runs-on: ubuntu-latest
    if: ${{ github.repository == '19-84/unstoppable-archiver' }}
    # Secrets are hoisted to env because the `secrets` context is not
    # available in step-level `if` — referencing it there is a workflow
    # parse error. The push step skips cleanly until the mirror secrets
    # are configured, so the workflow stays green before setup.
    env:
      FORGEJO_URL: ${{ secrets.FORGEJO_MIRROR_URL }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_MIRROR_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to Forgejo
        if: env.FORGEJO_URL != ''
        # No --prune: a mirror target initialised with a README defaults
        # to a `master` branch, and remotes refuse to delete a default
        # branch. Pruning it fails the whole (atomic) push, so `main`
        # never lands. Mirroring is additive; flip the remote default to
        # `main` and delete `master` once, in the Forgejo UI.
        run: |
          git push --force \
            "https://token:${FORGEJO_TOKEN}@${FORGEJO_URL#https://}" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'

  mirror-gitlab:
    name: Mirror to GitLab
    runs-on: ubuntu-latest
    if: ${{ github.repository == '19-84/unstoppable-archiver' }}
    env:
      GITLAB_URL: ${{ secrets.GITLAB_MIRROR_URL }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to GitLab
        if: env.GITLAB_URL != ''
        # No --prune: GitLab refuses to delete a project's default branch
        # (`master` when the project was created with a README), and that
        # rejection fails the whole atomic push, so `main` never lands.
        # Mirroring is additive; flip the project default to `main` and
        # delete `master` once, in the GitLab UI.
        run: |
          git push --force \
            "https://token:${GITLAB_TOKEN}@${GITLAB_URL#https://}" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
