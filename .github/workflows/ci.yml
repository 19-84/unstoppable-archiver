# Mirrors the local `make all` gates (lint + typecheck + tests + coverage).
# Browsers are never launched in the test suite (Playwright/Camoufox are
# mocked), so only Postgres is needed as a service.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archiver
          POSTGRES_PASSWORD: archiver
          POSTGRES_DB: archiver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archiver"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      ARCHIVER_DB_URL: postgresql://archiver:archiver@localhost:5432/archiver

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra test

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (pyright strict)
        run: uv run pyright

      - name: Tests + coverage gate (>= 95%)
        run: uv run pytest --tb=short -m "not slow"
