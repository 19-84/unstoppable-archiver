<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Unstoppable Archive — self-hosted web preservation with five capture tiers">
<title>{% block title %}Unstoppable Archive{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; }
  .font-mono { font-family: 'DM Mono', ui-monospace, monospace; }
  input::placeholder { opacity: 0.35; }
  *:focus-visible { outline: 2px solid #a855f7; outline-offset: 2px; border-radius: 4px; }
  .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
  @keyframes pulse-slow { 0%,100%{opacity:.4} 50%{opacity:1} }
  @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
  .pulse-slow { animation: pulse-slow 2s ease-in-out infinite; }
  .shimmer { position:relative; overflow:hidden; }
  .shimmer::after { content:''; position:absolute; top:0; left:0; width:50%; height:100%; background:linear-gradient(90deg,transparent,rgba(168,85,247,0.1),transparent); animation:shimmer 2s infinite; }
</style>
{% block head %}{% endblock %}
</head>
<body class="bg-[#050208] text-neutral-300 min-h-screen overflow-y-auto overflow-x-hidden {% block body_class %}{% endblock %}">

{% block body_bg %}
<div class="fixed inset-0 pointer-events-none" aria-hidden="true">
  <div class="absolute top-[-10%] right-[20%] w-[700px] h-[700px] bg-purple-600/[0.05] rounded-full blur-[180px]"></div>
  <div class="absolute bottom-[-20%] left-[10%] w-[400px] h-[400px] bg-violet-800/[0.04] rounded-full blur-[140px]"></div>
</div>
{% endblock %}

<div class="relative z-10 flex flex-col min-h-screen">

{% block header %}
<header class="px-6 py-5 flex items-center justify-between" role="banner">
  <a href="/" class="flex items-center gap-2.5" aria-label="Unstoppable Archive home">
    <div class="w-2 h-2 bg-purple-400 rounded-full" aria-hidden="true"></div>
    <span class="text-sm text-neutral-400">unstoppable archive</span>
  </a>
  {% block header_right %}
  <div class="flex items-center gap-3 text-xs text-neutral-400">
    <span>clearnet</span>
    <span class="text-purple-400">tor</span>
    <span class="text-violet-400">i2p</span>
  </div>
  {% endblock %}
</header>
{% endblock %}

<main class="flex-1 {% block main_class %}{% endblock %}">
  {% block content %}{% endblock %}
</main>

{% block footer %}
<footer class="px-6 py-4 text-center text-xs text-neutral-500" role="contentinfo">
  chromium → camoufox → proxy → wayback → archive.today
</footer>
{% endblock %}

</div>
</body>
</html>
