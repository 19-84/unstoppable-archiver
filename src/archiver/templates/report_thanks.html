{% extends "base.html" %}
{% block title %}Report submitted — Unstoppable Archive{% endblock %}
{% block main_class %}flex items-center justify-center px-6{% endblock %}
{% block content %}
<div class="text-center max-w-md">
  <div class="w-12 h-12 rounded-full bg-emerald-500/10 flex items-center justify-center mx-auto mb-4">
    <span class="text-emerald-400 text-2xl" aria-hidden="true">✓</span>
  </div>
  <h1 class="text-2xl font-bold text-white mb-2">Report received</h1>
  <p class="text-sm text-neutral-400 mb-8">Thanks. An admin will review your report.</p>
  <a href="/" class="px-5 py-2.5 bg-purple-500 text-white text-sm font-medium rounded-xl hover:bg-purple-400 transition inline-block">Back to home</a>
</div>
{% endblock %}
