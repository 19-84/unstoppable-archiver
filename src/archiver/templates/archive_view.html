<!-- ABOUTME: Snapshot viewer page with sandboxed iframe for archived content -->
<!-- ABOUTME: Dark toolbar + isolated iframe prevents XSS from archived pages -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Archived snapshot of {{ archive.title or archive.url }}">
<title>{{ archive.title or archive.url }} — Snapshot</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; frame-src 'self';">
<style>
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  .font-mono { font-family: 'DM Mono', ui-monospace, monospace; }
  *:focus-visible { outline: 2px solid #a855f7; outline-offset: 2px; }
  .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
  iframe { flex: 1; width: 100%; border: 0; }
</style>
<link rel="stylesheet" href="/static/css/fonts.css">
</head>
<body>

<nav class="sticky top-0 z-50" style="background:rgba(10,8,18,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(168,85,247,0.1);color:#a3a3a3;flex-shrink:0;" role="navigation" aria-label="Snapshot toolbar">
  <div style="padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;">
    <div style="display:flex;align-items:center;gap:12px;min-width:0;">
      <a href="/archive/{{ archive.id }}" style="color:#c084fc;text-decoration:none;font-size:14px;" aria-label="Back to detail">←</a>
      <div style="width:1px;height:16px;background:#262626;" aria-hidden="true"></div>
      <span class="font-mono" style="font-size:12px;color:#a3a3a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ archive.url }}</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
      {% if archive.source == "wayback" %}
      <span style="color:#60a5fa;font-size:12px;">▲ Wayback</span>
      {% elif archive.source == "archive_today" %}
      <span style="color:#fb923c;font-size:12px;">◆ archive.today</span>
      {% else %}
      <span style="color:#34d399;font-size:12px;">● Direct</span>
      {% endif %}
      <time style="font-size:12px;color:#a3a3a3;">{{ archive.created_at.strftime('%Y-%m-%d') if archive.created_at else '' }}</time>
      <div style="width:1px;height:16px;background:#262626;" aria-hidden="true"></div>
      <a href="/api/archives/{{ archive.id }}/warc" style="font-size:10px;padding:4px 8px;background:rgba(255,255,255,0.05);color:#a3a3a3;border-radius:4px;text-decoration:none;" download>WARC</a>
      <a href="/api/archives/{{ archive.id }}/snapshot" style="font-size:10px;padding:4px 8px;background:rgba(255,255,255,0.05);color:#a3a3a3;border-radius:4px;text-decoration:none;" download>HTML</a>
    </div>
  </div>
</nav>

<main>
  <!-- Sandboxed iframe: archived content runs in a fully isolated context.
       No allow-same-origin — prevents any script execution from accessing
       the parent page's cookies, API, or DOM. CSS that depends on
       same-origin font loading may break, but security comes first. -->
  <iframe sandbox=""
          src="/api/archives/{{ archive.id }}/snapshot"
          title="Archived snapshot of {{ archive.title or archive.url }}"
          loading="lazy"></iframe>
</main>

</body>
</html>
