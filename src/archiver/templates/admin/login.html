{% extends "base.html" %}
{% block title %}Admin Login — Unstoppable Archive{% endblock %}
{% block main_class %}flex items-center justify-center px-6{% endblock %}
{% block content %}
<div class="w-full max-w-sm">
  <h1 class="text-2xl font-bold text-white mb-1">Admin</h1>
  <p class="text-sm text-neutral-400 mb-8">Sign in to moderate reports.</p>
  <form method="POST" action="/admin/login" class="space-y-4">
    <input type="hidden" name="next" value="{{ next }}">
    <div>
      <label for="password" class="text-xs text-neutral-400 mb-2 block">Password</label>
      <input id="password" type="password" name="password" required autofocus
             class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-white outline-none font-mono text-sm focus:border-purple-500/40">
    </div>
    {% if error %}
    <p class="text-sm text-red-400">{{ error }}</p>
    {% endif %}
    <button type="submit" class="w-full px-5 py-2.5 bg-purple-500 text-white text-sm font-medium rounded-xl hover:bg-purple-400 transition">Sign in</button>
  </form>
</div>
{% endblock %}
